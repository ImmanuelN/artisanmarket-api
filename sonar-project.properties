# SonarQube Cloud (SonarCloud) analysis configuration — Code stage (4.3.2)
#
# The organization key was confirmed against the SonarCloud API rather than
# assumed. The project key follows SonarCloud's convention for a project
# imported from GitHub: <organization>_<repository>. If the project was imported
# under a different key, correct it here — the scan fails fast with
# "Could not find a default branch" or "Project not found" rather than silently
# analysing the wrong project.
sonar.organization=immanueln
sonar.projectKey=immanueln_artisanmarket-api
sonar.projectName=ArtisanMarket API

# Analysis scope. Everything under the repository root is source; the
# exclusions below are either third-party, generated, or not application code.
sonar.sources=.
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  node_modules/**,\
  coverage/**,\
  dist/**,\
  build/**,\
  docs/**,\
  k8s/**,\
  .github/**

# Route the SCM blame data through the checked-out git history so Sonar can
# attribute issues to commits. The Code stage checks out with fetch-depth 0
# specifically so this works.
sonar.scm.provider=git
