# SonarQube Cloud (SonarCloud) analysis configuration — Code stage (4.3.2)
#
# The organization key was confirmed against the SonarCloud API rather than
# assumed. The project key follows SonarCloud's convention for a project
# imported from GitHub: <GitHubLogin>_<repository>. Note the project key keeps
# the original GitHub login casing while the organization key is lowercased --
# both were read back from the SonarCloud API, not assumed. If the project was imported
# under a different key, correct it here — the scan fails fast with
# "Could not find a default branch" or "Project not found" rather than silently
# analysing the wrong project.
sonar.organization=immanueln
sonar.projectKey=ImmanuelN_artisanmarket-api
sonar.projectName=ArtisanMarket API

# Analysis scope. Everything under the repository root is source; the
# exclusions below are either third-party, generated, or not application code.
sonar.sources=.
sonar.sourceEncoding=UTF-8

# .github/ and k8s/ are deliberately NOT excluded. Sonar's githubactions rules
# found 14 real issues in the pipeline itself — unpinned action refs and npm
# lifecycle scripts — and excluding the directory would hide findings about the
# very thing this project builds. k8s/ is scanned by Checkov too; overlapping
# coverage across tools is the point, not duplication to be trimmed.
sonar.exclusions=\
  node_modules/**,\
  coverage/**,\
  dist/**,\
  build/**,\
  docs/**

# Route the SCM blame data through the checked-out git history so Sonar can
# attribute issues to commits. The Code stage checks out with fetch-depth 0
# specifically so this works.
sonar.scm.provider=git

# Test sources and coverage. Without lcov.reportPaths the quality gate sees 0%
# coverage on new code and fails regardless of how much is tested.
sonar.tests=tests
# Everything under tests/ is test code, not just *.test.js. setup.js was
# otherwise analysed as production source and counted 6 uncovered lines
# against the coverage gate.
sonar.test.inclusions=tests/**/*
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Make the Sonar step a GATE rather than a reporting step: the scanner waits for
# the server-side quality gate result and fails the build when it is ERROR.
# Without this the step uploads findings and always passes, which is how a
# Security rating of E can sit next to a green pipeline.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
