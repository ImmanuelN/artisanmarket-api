apiVersion: v1
kind: Service
metadata:
  name: artisanmarket-api
  namespace: artisanmarket
  labels:
    app.kubernetes.io/name: artisanmarket-api
    app.kubernetes.io/part-of: artisanmarket
    app.kubernetes.io/component: api
spec:
  # ClusterIP, not LoadBalancer: the API is reached through an ingress that
  # terminates TLS, so it is never exposed directly.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: artisanmarket-api
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
