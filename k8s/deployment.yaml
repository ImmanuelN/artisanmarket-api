apiVersion: apps/v1
kind: Deployment
metadata:
  name: artisanmarket-api
  namespace: artisanmarket
  labels:
    app.kubernetes.io/name: artisanmarket-api
    app.kubernetes.io/part-of: artisanmarket
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: artisanmarket-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artisanmarket-api
        app.kubernetes.io/part-of: artisanmarket
        app.kubernetes.io/component: api
    spec:
      # The API calls no Kubernetes API, so it needs no credential mounted.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Tag is rewritten by the Deploy stage. Never :latest — an unpinned
          # tag makes the scanned image and the running image different things.
          image: ghcr.io/immanueln/artisanmarket-api:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
          # Every secret is injected by reference. None appears literally here,
          # and the application fails closed if one is missing
          # (config/secrets.js assertRequiredSecrets, utils/encryption.js,
          # config/database.js) — see k8s/README.md for creating this Secret.
          envFrom:
            - secretRef:
                name: artisanmarket-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 256Mi
          # readOnlyRootFilesystem is on, so anything the process writes needs an
          # explicit writable mount. Node uses /tmp for os.tmpdir().
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # /health reports Mongo connectivity, so readiness correctly gates
          # traffic on the database being reachable.
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
