# Default-deny, then allow only what the API actually needs (CKV2_K8S_6).
#
# Without a policy selecting them, pods accept traffic from anywhere in the
# cluster and can reach anywhere — so a compromised neighbour has a free path to
# the API and to the database credentials it holds.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artisanmarket-api-default-deny
  namespace: artisanmarket
  labels:
    app.kubernetes.io/name: artisanmarket-api
    app.kubernetes.io/part-of: artisanmarket
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: artisanmarket-api
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artisanmarket-api-allow
  namespace: artisanmarket
  labels:
    app.kubernetes.io/name: artisanmarket-api
    app.kubernetes.io/part-of: artisanmarket
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: artisanmarket-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP from the ingress controller only. The client talks to the API through
    # the ingress, not pod-to-pod, so the client pods are not listed here.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5000
  egress:
    # DNS, without which nothing else resolves.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Outbound HTTPS. MongoDB Atlas, Stripe, Plaid and ImageKit are all external
    # managed services reached over TLS.
    - ports:
        - protocol: TCP
          port: 443
    # MongoDB, when it runs inside the cluster rather than as Atlas.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mongodb
      ports:
        - protocol: TCP
          port: 27017
